{% extends "base.html" %}

{% block content %}
<h2>{% if product %}Edit Product{% else %}List a New Product{% endif %}</h2>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="crop_type" class="form-label">Crop Type</label>
                        <input type="text" class="form-control" id="crop_type" name="crop_type" value="{% if product %}{{ product.crop_type }}{% endif %}" required>
                    </div>
                    <div class="mb-3">
                        <label for="quantity_kg" class="form-label">Quantity (kg)</label>
                        <input type="number" class="form-control" id="quantity_kg" name="quantity_kg" min="1" value="{% if product %}{{ product.quantity_kg }}{% endif %}" required>
                    </div>
                    <div class="mb-3">
                        <label for="price_per_kg" class="form-label">Price per kg (₦)</label>
                        <input type="number" step="0.01" class="form-control" id="price_per_kg" name="price_per_kg" min="0.01" value="{% if product %}{{ product.price_per_kg }}{% endif %}" required>
                    </div>
                    <div class="mb-3">
                        <label for="harvest_date" class="form-label">Harvest Date</label>
                        <input type="date" class="form-control" id="harvest_date" name="harvest_date" value="{% if product %}{{ product.harvest_date.strftime('%Y-%m-%d') }}{% endif %}" required>
                    </div>
                    <div class="mb-3">
                        <label for="quality" class="form-label">Quality Grade</label>
                        <select class="form-control" id="quality" name="quality" required>
                            <option value="A" {% if product and product.quality == 'A' %}selected{% endif %}>Grade A (Premium)</option>
                            <option value="B" {% if product and product.quality == 'B' %}selected{% endif %}>Grade B (Good)</option>
                            <option value="C" {% if product and product.quality == 'C' %}selected{% endif %}>Grade C (Standard)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="image_url" class="form-label">Image URL</label>
                        <input type="url" class="form-control" id="image_url" name="image_url" placeholder="https://example.com/image.jpg" value="{% if product %}{{ product.image_url }}{% endif %}">
                        <div class="form-text">Enter a URL for the product image or leave blank to use a default placeholder.</div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{% if product %}{{ product.description }}{% endif %}</textarea>
                    </div>
                    <button type="submit" class="btn btn-success">{% if product %}Update Product{% else %}List Product{% endif %}</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
